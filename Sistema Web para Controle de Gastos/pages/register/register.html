<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Registrar - Controle de Gastos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Fontes e Ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <link rel="icon" href="https://img.icons8.com/office/40/combo-chart.png" type="image/png">


    <link rel="stylesheet" href="../../global.css">
    <link rel="stylesheet" href="register.css">
</head>
<body class="centralize login-background">
    <div class="login-box">
        <form>
            <h2>Registro</h2>

            <div class="form-field">
                <label>Email</label>
                <input type="email" id="email" placeholder="seu@email.com" onchange="onChangeEmail()" />
                <div class="error" id="email-required-error">Email é obrigatório</div>
                <div class="error" id="email-invalid-error">Email é inválido</div>
            </div>

            <div class="form-field">
                <label>Senha</label>
                <input type="password" id="password" placeholder="Senha" onchange="onChangePassword()" />
                <div class="error" id="password-required-error">Senha é obrigatória</div>
                <div class="error" id="password-min-length-error">Senha deve ter pelo menos 6 caracteres</div>
            </div>

            <div class="form-field">
                <label>Confirmar senha</label>
                <input type="password" id="confirmPassword" placeholder="Confirmar senha" onchange="onChangeConfirmPassword()" />
                <div class="error" id="password-doesnt-match-error">Senha e Confirmar senha devem ser iguais</div>
            </div>

            <button type="button" class="solid" id="register-button" onclick="register()" disabled>Registrar</button>
            <button type="button" class="clear" onclick="history.back()">Voltar ao Login</button>
        </form>
    </div>


    <script src="https://www.gstatic.com/firebasejs/11.7.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.7.3/firebase-auth-compat.js"></script>
    <script src="../../firebase-init.js"></script>
    <script src="register.js"></script>
    <script src="../../validations.js"></script>
    <script src="../../loading.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Transação - Controle de Gastos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../global.css">
    <link rel="stylesheet" href="transaction.css">

    <link rel="icon" href="https://img.icons8.com/office/40/combo-chart.png" type="image/png">

</head>
<body>
    <header class="home-header">
        <h2>Nova Transação</h2>
        <button type="button" class="clear logout-btn" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> Sair
        </button>
    </header>
    

    <main class="centralize">
        <div class="transaction-box">
            <form method="post">
                <div class="form-field">
                    <label>Transação *</label>
                    <div>
                        <input type="radio" name="type" checked id="Despesa">
                        <label for="Despesa">Despesa</label>
                        <input type="radio" name="type" id="Receita">
                        <label for="Receita">Receita</label>
                    </div>
                </div>

                <div class="form-field">
                    <label>Data da transação *</label>
                    <input type="date" onchange="onChangeDate()" id="date">
                    <div class="error" id="date-required-error">Data é obrigatória/inválida</div>
                </div>

                <div class="form-field">
                    <label>Moeda *</label>
                    <select id="currency">
                        <option value="USD">Dólar</option>
                        <option value="EUR">Euro</option>
                        <option value="AOA" selected>Kwanza</option>
                        <option value="BRL">Real</option>
                    </select>
                </div>

                <div class="form-field">
                    <label>Valor *</label>
                    <input type="number" onchange="onChangeValue()" id="value">
                    <div class="error" id="value-required-error">Valor é obrigatório</div>
                    <div class="error" id="value-less-or-equal-to-zero-error">Valor deve ser maior que zero</div>
                </div>

                <div class="form-field">
                    <label>Tipo de transação *</label>
                    <select onchange="onChangeTransactionType()" id="transaction-type">
                        <option value="">-- Selecione um tipo --</option>
                        <option>Acomodação</option>
                        <option>Alimentação</option>
                        <option>Salário</option>
                        <option>Supermercado</option>
                        <option>Transporte</option>
                        <option>Outros</option>
                    </select>
                    <div class="error" id="transaction-type-required-error">Campo obrigatório</div>
                </div>

                <div class="form-field">
                    <label>Descrição</label>
                    <input type="text" id="description">
                </div>

                <button type="button" class="solid" id="save-button" disabled onclick="saveTransaction()">Salvar</button>
                <button type="button" class="clear" onclick="history.back()">Cancelar</button>
            </form>
        </div>
    </main>


    <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-firestore-compat.js"></script>
    <script src="../../firebase-init.js"></script>
    <script src="../../auth-guard.js"></script>
    <script src="../../loading.js"></script>
    <script src="../../services/transaction.service.js"></script>
    <script src="transaction.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Home - Controle de Gastos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fontes e Estilos -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../../global.css">
    <link rel="stylesheet" href="home.css">

    <link rel="icon" href="https://img.icons8.com/office/40/combo-chart.png" type="image/png">





    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    
    
</head>
<body>
    <header class="home-header">
        <h2>Minhas Transações</h2>
        <button type="button" class="clear" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> Sair
        </button>
    </header>

    <main class="home-main">
        <ol id="transactions" class="transaction-list"></ol>
        <button class="fab fixed bottom right" onclick="newTransaction()">+</button>

        <div class="filter-container">
            <select id="month-filter">
              <option value="all">Todos os meses</option>
              <option value="1">Janeiro</option>
              <option value="2">Fevereiro</option>
              <option value="3">Março</option>
              <option value="4">Abril</option>
              <option value="5">Maio</option>
              <option value="6">Junho</option>
              <option value="7">Julho</option>
              <option value="8">Agosto</option>
              <option value="9">Setembro</option>
              <option value="10">Outubro</option>
              <option value="11">Novembro</option>
              <option value="12">Dezembro</option>
            </select>
          
            <select id="year-filter">
              <option value="all">Todos os anos</option>
           
            </select>
          </div>
         

        
          <div class="balance-display">
            <h2>Saldo Geral </h2>
            <span id="balance-total"></span>
          </div>

        
          
          
          
    <button id="export-pdf-btn">Exportar para PDF</button>

    </main>


    <script src="https://www.gstatic.com/firebasejs/11.7.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.7.3/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.7.3/firebase-firestore-compat.js"></script>
    <script src="../../firebase-init.js"></script>
    <script src="../../auth-guard.js"></script>
    <script src="../../loading.js"></script>
    <script src="../../services/transaction.service.js"></script>
    <script src="home.js"></script>
</body>
</html>

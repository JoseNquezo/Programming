<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Artesanato e Arte Contemporânea de Angola</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Arial:wght@300;400;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="contact.css">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <nav class="navbar">
        <div class="navbar-container">
                
<img src="../imagens/logo.png" width="80px" height="80px" id="img1">
            <ul class="navbar-menu">
                <li class="navbar-item"><a href="../index.html" class="navbar-link">Página Inicial</a></li>
                  <li class="navbar-item"><a href="quiz.html" class="navbar-link">Quiz</a></li>
                 </ul>
        </div>
    </nav>

    <header class="contact-header">
        <h1>Fale Connosco</h1>
        <h2>Conecte-se com a arte angolana</h2>
    </header>

    <main>
        <section class="contact-content">
            <div class="contact-form">
                <h3>Envie-nos uma Mensagem</h3>
                <form action="sucesso.html">
                    <label for="name">Nome Completo:</label>
                    <input type="text" id="name" name="name" required>

                    <label for="email">Endereço de Email:</label>
                    <input type="email" id="email" name="email" required>

                    <label for="subject">Assunto:</label>
                    <input type="text" id="subject" name="subject">

                    <label for="message">Sua Mensagem:</label>
                    <textarea id="message" name="message" required placeholder="Partilhe suas dúvidas, comentários ou interesse em alguma obra específica..."></textarea>

                    <button type="submit">Enviar Mensagem</button>
                </form>
            </div>

            
        </section>

        <section class="developer">
            <h3>Desenvolvedor</h3>
            <div class="developer-grid">
                <div class="developer-card">
                    <img src="../imagens/ZmartCEO.jpg" alt="Foto do Desenvolvedor" title="José Francisco Correia Nquezo">
                    <h4>José Francisco Correia Nquezo</h4>
                    <p>Desennvolvedor Web</p>
                    <p>Especialista em FrontEnd & BackEnd.</p>
                </div>
            </div>
               
        </section>
       
    </main>

    <footer class="main-footer">
    <div class="footer-content">
        <p>&copy; 2025 - Artesanato e Arte Contemporânea de Angola</p>
        <ul class="footer-links">   
               
                
            </ul>
    </div>
       
    
</footer>


</body>

</html>
